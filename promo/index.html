<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PocketAgentRemote Intro</title>
<style>
  :root {
    --bg: #0e0c0b;
    --ink: #f4ede1;
    --muted: #9a8f82;
    --faint: #3a3430;
    --red: #b3262a;
    --red-deep: #7a1518;
    --gold: #d8b25c;
    --gold-lite: #f1d58c;
    --green: #62d08e;
    --panel: #1b1918;
    --panel-2: #242120;
    --line: rgba(255, 255, 255, 0.08);
  }
  html, body { margin: 0; background: var(--bg); overflow: hidden; }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; color: var(--ink); }
  #stage { position: relative; overflow: hidden; background: var(--bg); }
  #glow { position: absolute; inset: -10%; background: radial-gradient(ellipse at 50% 42%, rgba(179, 38, 42, 0.32), transparent 58%); }
  #grid { position: absolute; inset: 0; background: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.07) 1px, transparent 0) 0 0 / 28px 28px; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #stripes { position: absolute; left: 50%; top: 50%; width: 260%; height: 0; pointer-events: none; }
  #stripes div { position: absolute; left: 0; right: 0; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .scene { position: absolute; inset: 0; }
  .mono { font-family: "SF Mono", Menlo, monospace; }

  .headline { font-weight: 800; letter-spacing: -0.03em; white-space: nowrap; }
  .sub { color: var(--muted); font-weight: 500; white-space: nowrap; }
  .tag { font: 600 18px/1 "SF Mono", Menlo, monospace; letter-spacing: 0.24em; color: var(--gold); white-space: nowrap; }
  .tag b { color: var(--muted); font-weight: 600; margin-right: 18px; }

  .chip {
    display: inline-flex; align-items: center; gap: 12px; padding: 14px 26px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line); font-weight: 650; font-size: 30px; white-space: nowrap;
  }
  .chip i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }

  .key {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 64px; height: 64px;
    padding: 0 22px; border-radius: 14px; background: linear-gradient(#2e2a28, #1d1a19);
    border: 1px solid rgba(255, 255, 255, 0.14); box-shadow: 0 6px 0 #0a0908, 0 12px 30px rgba(0, 0, 0, 0.5);
    font: 600 28px/1 "SF Mono", Menlo, monospace; color: var(--ink); white-space: nowrap;
  }

  .win {
    background: var(--panel); border-radius: 16px; border: 1px solid var(--line); overflow: hidden;
    box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
  }
  .win .bar { height: 46px; display: flex; align-items: center; padding: 0 18px; background: var(--panel-2); border-bottom: 1px solid var(--line); }
  .win .bar span { width: 13px; height: 13px; border-radius: 50%; margin-right: 8px; background: #4a4441; }
  .win .bar em { flex: 1; text-align: center; font-style: normal; color: var(--muted); font-size: 16px; font-weight: 600; margin-right: 63px; }
  .win .body { position: absolute; left: 0; right: 0; top: 47px; bottom: 0; }

  .msg { position: absolute; left: 32px; right: 32px; font-size: 24px; line-height: 1.4; }
  .bubble { margin-left: auto; max-width: 70%; width: fit-content; background: #33302d; padding: 14px 20px; border-radius: 18px; }
  .composer {
    position: absolute; left: 28px; right: 28px; bottom: 28px; height: 78px; border-radius: 18px; background: #262321;
    border: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; padding: 0 24px; font-size: 26px;
  }
  .caret { display: inline-block; width: 2px; height: 30px; background: var(--gold); margin-left: 2px; vertical-align: middle; }
  .log { font: 22px/1.8 "SF Mono", Menlo, monospace; color: #c9bfb2; }
  .log .ok { color: var(--green); }
  .spin { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #5a524d; border-top-color: var(--gold); vertical-align: -2px; margin-right: 12px; }

  .card {
    background: #2a2624; border: 1px solid rgba(241, 213, 140, 0.35); border-radius: 16px; padding: 24px 28px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  .btn { display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 12px; font-weight: 650; font-size: 22px; }
  .btn small { font: 600 16px "SF Mono", Menlo, monospace; opacity: 0.7; }

  .legend .row {
    display: flex; align-items: center; gap: 22px; padding: 12px 18px; border-radius: 14px; font-size: 26px;
    color: var(--muted); white-space: nowrap;
  }
  .legend .row b { min-width: 118px; font: 700 24px "SF Mono", Menlo, monospace; color: var(--ink); }
  .legend .row.on { background: rgba(216, 178, 92, 0.14); color: var(--ink); }
  .legend .row.on b { color: var(--gold-lite); }

  .pop { position: absolute; width: 100%; background: #2b2725; border: 1px solid var(--line); border-radius: 14px; padding: 8px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
  .pop div { padding: 10px 16px; border-radius: 10px; font: 24px "SF Mono", Menlo, monospace; color: #cfc6ba; }
  .pop div.on { background: var(--gold); color: #1a1410; }

  /* --- recreated PocketAgentRemote UI (real metrics from MenuOverlayController / FailureToastController) --- */
  .ovl { position: relative; box-sizing: border-box; background: rgba(40, 38, 38, 0.9); border-radius: 16px; padding: 0 18px 18px;
         box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.12); font-family: -apple-system, sans-serif; }
  .ovl-title { height: 30px; padding-top: 18px; font: 600 15px -apple-system, sans-serif; color: rgba(235, 235, 245, 0.6); display: flex; align-items: center; }
  .ovl-row { height: 54px; border-radius: 8px; display: flex; align-items: center; padding: 0 14px; font: 500 26px -apple-system, sans-serif;
             color: #fff; white-space: nowrap; overflow: hidden; }
  .ovl-row.on, .ovl-slot.on, .ovl-cell.on { background: rgba(10, 132, 255, 0.85); }
  .ovl-hint { height: 26px; font: 400 13px -apple-system, sans-serif; color: rgba(235, 235, 245, 0.4); white-space: pre; display: flex; align-items: flex-end; }
  .ovl-slot { position: absolute; border-radius: 8px; display: flex; align-items: center; justify-content: center; font: 500 26px -apple-system, sans-serif; color: #fff; text-align: center; }
  .ovl-cell { position: absolute; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
  .pin { color: var(--gold); font-size: 18px; margin-right: 12px; }
  .toast { box-sizing: border-box; width: 520px; height: 64px; border-radius: 14px; background: rgba(40, 38, 38, 0.92); display: flex; align-items: center;
           justify-content: center; text-align: center; padding: 0 22px; font: 500 20px/1.25 -apple-system, sans-serif; color: #fff;
           box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.12); }
  .tile { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-family: "SF Pro Rounded", -apple-system, sans-serif;
          box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 6px 16px rgba(0, 0, 0, 0.4); flex: none; }
  .desktop { border-radius: 20px; overflow: hidden; background: radial-gradient(ellipse at 30% 20%, #3b2320, #151110 72%);
             box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6), 0 0 0 10px #2a2624; }
  .mbar { position: absolute; left: 0; right: 0; top: 0; height: 34px; background: rgba(18, 16, 15, 0.8); display: flex; align-items: center;
          padding: 0 16px; font: 500 16px -apple-system, sans-serif; color: #eee; white-space: nowrap; }
  .mbar .app { font-weight: 700; margin-right: 12px; padding: 3px 8px; border-radius: 5px; }
  .mbar .mn { padding: 3px 9px; border-radius: 5px; margin-right: 4px; }
  .mbar .mn.on, .mbar .app.on { background: rgba(10, 132, 255, 0.85); }
  .mbar .right { position: absolute; right: 16px; top: 0; height: 34px; display: flex; gap: 16px; align-items: center; }
  .mbar .ctl { display: inline-flex; padding: 3px 6px; border-radius: 5px; }
  .mbar .ctl.on { background: rgba(255, 255, 255, 0.2); }
  .desk { position: absolute; left: 0; right: 0; top: 34px; bottom: 0; }
  .drop { position: absolute; width: 340px; background: rgba(40, 38, 38, 0.95); border-radius: 10px; padding: 6px;
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.12); font: 400 17px -apple-system, sans-serif; }
  .drop div { padding: 7px 14px; border-radius: 6px; color: #eee; white-space: nowrap; }
  .drop div.on { background: rgba(10, 132, 255, 0.9); color: #fff; }
  .drop hr { border: 0; border-top: 1px solid rgba(255, 255, 255, 0.12); margin: 5px 8px; }
  .side { position: absolute; left: 0; top: 0; bottom: 0; width: 250px; border-right: 1px solid var(--line); padding: 18px 12px; box-sizing: border-box; }
  .side div { padding: 12px 14px; border-radius: 10px; font-size: 21px; color: #cfc6ba; margin-bottom: 6px; white-space: nowrap; }
  .side div.on { background: #3a3431; color: #fff; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #ff9f0a; margin-left: 10px; vertical-align: 2px; }
  .mainpane { position: absolute; left: 250px; right: 0; top: 0; bottom: 0; padding: 26px 30px; box-sizing: border-box; }
  .bar-f { height: 14px; border-radius: 7px; background: #2f2b29; margin-top: 16px; }
  .tcard { box-sizing: border-box; background: #221f1e; border: 1px solid var(--line); border-radius: 20px; padding: 24px 28px; display: flex; align-items: center; gap: 22px; }
  .tcard h4 { margin: 0; font-size: 28px; font-weight: 750; white-space: nowrap; }
  .tcard p { margin: 6px 0 0; font-size: 20px; color: var(--muted); white-space: nowrap; }
  .strike { position: relative; display: inline-block; }
  .strike i { position: absolute; left: -4px; top: 52%; height: 3px; background: #ff5a4e; border-radius: 2px; }
  .kt { font-weight: 800; letter-spacing: -0.03em; white-space: nowrap; }

  #caption {
    position: absolute; left: 50%; transform: translateX(-50%); text-align: center; color: rgba(244, 237, 225, 0.92);
    font-weight: 500; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8); width: 86%;
  }
  .landscape #caption { bottom: 44px; font-size: 30px; }
  .portrait #caption { bottom: 120px; font-size: 40px; line-height: 1.3; }
</style>
</head>
<body>
<div id="stage"><div id="glow"></div><div id="grid"></div><div id="scenes"></div><div id="stripes"><div style="top:-250px;height:220px;background:var(--gold)"></div><div style="top:0;height:220px;background:var(--red)"></div></div><div id="flash"></div><div id="caption"></div></div>
<script src="out/timing.js"></script>
<script src="video.js"></script>
</body>
</html>
